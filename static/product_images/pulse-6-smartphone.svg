<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad-electronics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#bg-grad-electronics)"/>
  <g filter="url(#shadow)">
    
        <!-- Smartphone / Device Vector -->
        <rect x="125" y="25" width="70" height="135" rx="12" fill="#3B82F6" stroke="#1D4ED8" stroke-width="3"/>
        <rect x="131" y="36" width="58" height="100" rx="3" fill="#FFFFFF"/>
        <circle cx="160" cy="148" r="4" fill="#3B82F6" opacity="0.8"/>
        <!-- Screen UI Details -->
        <rect x="139" y="48" width="42" height="6" rx="3" fill="#3B82F6" opacity="0.4"/>
        <rect x="139" y="60" width="30" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
        <circle cx="160" cy="90" r="14" fill="#3B82F6" opacity="0.25"/>
        <path d="M155 90 L165 90 M160 85 L160 95" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>
    
  </g>
  <g filter="url(#shadow)">
    <rect x="20" y="164" width="280" height="26" rx="13.0" fill="#FFFFFF" fill-opacity="0.94" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="160" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">Pulse 6 Smartphone</text>
  </g>
</svg>